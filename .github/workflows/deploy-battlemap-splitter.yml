name: Deploy Battlemap Splitter

on:
  push:
    branches: [main]
    paths:
      - 'packages/battlemap-splitter/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-battlemap-splitter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-battlemap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Test
        run: pnpm turbo run test --filter=@open20/battlemap-splitter

      - name: Build
        run: pnpm turbo run build --filter=@open20/battlemap-splitter --force
        env:
          DEPLOY_TARGET: github-pages

      - name: Deploy to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf battlemap-splitter/
          mkdir -p battlemap-splitter
          cp -R packages/battlemap-splitter/dist/. battlemap-splitter/
          git add battlemap-splitter/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: battlemap-splitter ${{ github.sha }}"
            git push origin gh-pages
          fi

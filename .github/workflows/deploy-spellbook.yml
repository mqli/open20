name: Deploy Spellbook

on:
  push:
    branches: [main]
    paths:
      - 'packages/spellbook/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'packages/content/**'
      - 'packages/content-*/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-spellbook.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-spellbook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Test (unit)
        run: pnpm turbo run test --filter=@open20/spellbook

      - name: Install Playwright browsers
        run: pnpm --filter @open20/spellbook exec playwright install --with-deps chromium

      - name: Test (e2e)
        run: pnpm turbo run test:e2e --filter=@open20/spellbook
        env:
          CI: 'true'

      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/spellbook/playwright-report/
          retention-days: 30

      - name: Build
        run: pnpm turbo run build --filter=@open20/spellbook --force
        env:
          DEPLOY_TARGET: github-pages

      - name: Deploy to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf spellbook/
          mkdir -p spellbook
          cp -R packages/spellbook/dist/. spellbook/
          git add spellbook/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: spellbook ${{ github.sha }}"
            git push origin gh-pages
          fi
